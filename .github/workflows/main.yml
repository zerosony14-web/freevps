name: Windows Cloud RDP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        shell: powershell

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#
        shell: powershell

      - name: 3. Install Tailscale & Connect
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 8
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --reset
          Start-Sleep -Seconds 10
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TS_IP=$ts_ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $ts_ip"
        shell: powershell

      - name: 4. Send Details to Telegram
        env:
          BOT_TOKEN: "8752582056:AAE-CzI4h2Wh81CfZU9F39EVeDouOUhZbd4"
          CHAT_ID: "6577754576"
        run: |
          $ts_ip = $env:TS_IP
          $txt = "🚀 NEW RDP VM ONLINE!`n`n🖥️ IP: $ts_ip`n👤 USER: NvDAdmin`n🔑 PASS: P@ssw0rd1qazXSW@#`n`n⏰ EXPIRES IN: ~6 Hours`n🔄 AUTO-RESTART: ON`n`nConnect via: mstsc.exe -> $ts_ip"
          $uri = "https://api.telegram.org/$env:BOT_TOKEN/sendMessage"
          $body = @{chat_id=$env:CHAT_ID; text=$txt; parse_mode="Markdown"} | ConvertTo-Json
          Invoke-RestMethod -Uri $uri -Method Post -Body $body -ContentType "application/json"
          Write-Host "✅ Telegram sent!"
        shell: powershell

      - name: 5. Wait & Auto-Restart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          BOT_TOKEN: "8752582056:AAE-CzI4h2Wh81CfZU9F39EVeDouOUhZbd4"
          CHAT_ID: "6577754576"
        run: |
          $waitMinutes = 350
          for ($i = 1; $i -le $waitMinutes; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/$waitMinutes] Running... next VM in $($waitMinutes - $i) min"
          }
          Write-Host "🚀 Spawning NEW VM..."
          $headers = @{"Authorization"="token $env:GITHUB_TOKEN"; "Accept"="application/vnd.github.v3+json"}
          $body = @{ref="main"} | ConvertTo-Json
          $apiUrl = "https://api.github.com/repos/$env:GITHUB_REPO/actions/workflows/main.yml/dispatches"
          try {
            Invoke-RestMethod -Uri $apiUrl -Method Post -Headers $headers -Body $body -ContentType "application/json"
            $notify = @{chat_id=$env:CHAT_ID; text="⚠️ OLD VM DYING! New VM starting — check Telegram for new IP message."} | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.telegram.org/$env:BOT_TOKEN/sendMessage" -Method Post -Body $notify -ContentType "application/json"
            Write-Host "✅ New VM triggered successfully!"
          } catch {
            Write-Host "❌ FAILED: $_"
          }
        shell: powershell
